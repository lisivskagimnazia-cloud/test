<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор електрика</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="logo">⚡</div>
      <div>
        <h1>Калькулятор електрика</h1>
        <p>Швидкий розрахунок напруги, струму, опору та потужності.</p>
      </div>
    </header>

    <section class="grid" aria-label="Параметри електричного кола">
      <label>Напруга U <span>(В)</span>
        <input id="voltage" type="number" value="230" min="0" step="any">
      </label>
      <label>Струм I <span>(А)</span>
        <input id="current" type="number" value="10" min="0" step="any">
      </label>
      <label>Опір R <span>(Ω)</span>
        <input id="resistance" type="number" value="23" min="0" step="any">
      </label>
      <label>Потужність P <span>(Вт)</span>
        <input id="power" type="number" value="2300" min="0" step="any">
      </label>
    </section>

    <button id="calculate" type="button">⚡ Розрахувати</button>
    <button id="clear" class="secondary" type="button">Очистити</button>

    <div class="result" id="result">Введіть будь-які два відомі параметри та натисніть «Розрахувати».</div>

    <section class="formulas">
      <h2>Основні формули</h2>
      <div class="formula-list">
        <span>P = U × I</span>
        <span>U = I × R</span>
        <span>I = U / R</span>
      </div>
    </section>

    <p class="hint">Розрахунки є довідковими. Перед роботою з електроустановками дотримуйтесь правил електробезпеки.</p>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    function num(id) {
      const value = parseFloat($(id).value);
      return Number.isFinite(value) && value >= 0 ? value : null;
    }
    function fmt(value) {
      if (value === null || !Number.isFinite(value)) return '—';
      return Number.isInteger(value) ? value : value.toFixed(2);
    }

    function calculate() {
      let U = num('voltage'), I = num('current'), R = num('resistance'), P = num('power');
      const known = [U, I, R, P].filter(v => v !== null).length;

      if (known < 2) {
        $('result').textContent = 'Потрібно ввести щонайменше два параметри.';
        return;
      }

      if (U !== null && I !== null) { P = U * I; R = I ? U / I : null; }
      else if (U !== null && R !== null) { I = R ? U / R : null; P = U * I; }
      else if (I !== null && R !== null) { U = I * R; P = U * I; }
      else if (P !== null && U !== null) { I = U ? P / U : null; R = I ? U / I : null; }
      else if (P !== null && I !== null) { U = I ? P / I : null; R = I ? U / I : null; }
      else if (P !== null && R !== null) { I = R ? Math.sqrt(P / R) : null; U = I * R; }

      if (U !== null) $('voltage').value = fmt(U);
      if (I !== null) $('current').value = fmt(I);
      if (R !== null) $('resistance').value = fmt(R);
      if (P !== null) $('power').value = fmt(P);

      $('result').innerHTML = `<strong>P = ${fmt(P)} Вт</strong><br><small>U = ${fmt(U)} В · I = ${fmt(I)} А · R = ${fmt(R)} Ω</small>`;
    }

    function clearFields() {
      ['voltage', 'current', 'resistance', 'power'].forEach(id => $(id).value = '');
      $('result').textContent = 'Поля очищено. Введіть будь-які два відомі параметри.';
    }

    $('calculate').addEventListener('click', calculate);
    $('clear').addEventListener('click', clearFields);
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') calculate();
      });
    });
  </script>
</body>
</html>
